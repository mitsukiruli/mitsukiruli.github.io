<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的推角週邊祭壇</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
            --ig-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            color: var(--text-main);
        }

        nav {
            background: white;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 935px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 44px;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #eee;
            margin-right: 80px;
            object-fit: cover;
        }

        .user-info h2 { font-weight: 300; font-size: 28px; margin: 0; }

        /* 精選動態 */
        .highlights {
            display: flex;
            gap: 25px;
            padding: 10px 0 40px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
        }

        .highlight-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            cursor: pointer;
        }

        .highlight-circle {
            width: 77px;
            height: 77px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            padding: 3px;
            background: white;
            margin-bottom: 5px;
            object-fit: cover;
            transition: all 0.2s;
        }

        /* 選中時的 IG 彩虹邊框效果 */
        .highlight-item.active .highlight-circle {
            border: 2px solid transparent;
            background-image: linear-gradient(white, white), var(--ig-gradient);
            background-origin: border-box;
            background-clip: content-box, border-box;
        }

        .highlight-name { font-size: 12px; font-weight: 600; }

        /* 貼文網格 */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            margin-top: 50px;
        }

        .post {
            aspect-ratio: 1 / 1;
            background-color: #efefef;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .post img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s;
        }

        /* 隱藏邏輯 */
        .post.hidden { display: none; }

        @media (max-width: 735px) {
            .profile-pic { width: 80px; height: 80px; margin-right: 30px; }
            .post-grid { gap: 3px; }
            .container { padding: 0; }
            .header { padding: 20px; margin-bottom: 0; }
        }
    </style>
</head>
<body>

    <nav>Oshi_Collection</nav>

    <div class="container">
        <header class="header">
            <img src="https://via.placeholder.com/150" alt="大頭貼" class="profile-pic">
            <div class="user-info">
                <h2>你的 ID</h2>
                <p>這裡是放所有推角週邊的夢幻空間 ✨</p>
            </div>
        </header>

        <div class="highlights">
            <div class="highlight-item active" data-target="all">
                <div class="highlight-circle" style="display: flex; align-items: center; justify-content: center; background: #eee;">全</div>
                <span class="highlight-name">全部</span>
            </div>
            <div class="highlight-item" data-target="char-a">
                <img src="https://via.placeholder.com/80/FFB6C1" class="highlight-circle">
                <span class="highlight-name">角色 A</span>
            </div>
            <div class="highlight-item" data-target="char-b">
                <img src="https://via.placeholder.com/80/ADD8E6" class="highlight-circle">
                <span class="highlight-name">角色 B</span>
            </div>
        </div>

        <div class="post-grid">
            <div class="post" data-category="char-a"><img src="https://via.placeholder.com/300/FFB6C1?text=A-1"></div>
            <div class="post" data-category="char-b"><img src="https://via.placeholder.com/300/ADD8E6?text=B-1"></div>
            <div class="post" data-category="char-a"><img src="https://via.placeholder.com/300/FFB6C1?text=A-2"></div>
            <div class="post" data-category="char-b"><img src="https://via.placeholder.com/300/ADD8E6?text=B-2"></div>
            <div class="post" data-category="char-a"><img src="https://via.placeholder.com/300/FFB6C1?text=A-3"></div>
        </div>
    </div>

    <script>
        const filters = document.querySelectorAll('.highlight-item');
        const posts = document.querySelectorAll('.post');

        filters.forEach(filter => {
            filter.addEventListener('click', () => {
                // 1. 切換按鈕的高亮狀態
                filters.forEach(f => f.classList.remove('active'));
                filter.classList.add('active');

                // 2. 取得要過濾的角色標籤
                const target = filter.getAttribute('data-target');

                // 3. 顯示或隱藏貼文
                posts.forEach(post => {
                    const category = post.getAttribute('data-category');
                    if (target === 'all' || category === target) {
                        post.classList.remove('hidden');
                    } else {
                        post.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>
</html>
