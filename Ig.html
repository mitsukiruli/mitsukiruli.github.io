<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的推角週邊祭壇 - 集中版</title>
    <style>
        :root {
            --bg-pattern: #f0f8ff;
            --stripe-color: #d0e7ff;
            --ig-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --border-color: #dbdbdb;
        }

        /* 1. 外層背景與置中 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* 淺藍色斜線背景 */
            background-color: var(--bg-pattern);
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 15px,
                var(--stripe-color) 15px,
                var(--stripe-color) 17px
            );
        }

        /* 2. 中間的正方形容器 */
        .square-container {
            width: 90vw;
            max-width: 550px; /* 電腦版大小 */
            aspect-ratio: 1 / 1; /* 關鍵：強制正方形 */
            
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 確保內容不超出圓角 */
        }

        /* 3. 標題列 (置頂) */
        nav {
            background: white;
            border-bottom: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* 4. 可捲動的內容區 */
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            scrollbar-width: none; /* Firefox 隱藏捲動條 */
        }
        .scrollable-content::-webkit-scrollbar {
            display: none; /* Chrome/Safari 隱藏捲動條 */
        }

        /* 5. 個人檔案頭部 */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 5px;
        }

        .profile-pic {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #eee;
            margin-right: 15px;
            object-fit: cover;
        }

        .user-info h2 { font-size: 18px; margin: 0; }
        .user-info p { font-size: 13px; color: #666; margin: 5px 0 0; }

        /* 6. 精選動態區 (分類按鈕) */
        .highlights {
            display: flex;
            gap: 15px;
            padding: 10px 0;
            overflow-x: auto;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 15px;
        }

        .highlight-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 65px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .highlight-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            padding: 2px;
            background: white;
            margin-bottom: 5px;
            object-fit: cover;
            transition: transform 0.2s;
        }

        /* 選中狀態的彩虹外框 */
        .highlight-item.active .highlight-circle {
            border: 2px solid transparent;
            background-image: linear-gradient(white, white), var(--ig-gradient);
            background-origin: border-box;
            background-clip: content-box, border-box;
            transform: scale(1.08);
        }

        .highlight-name { font-size: 10px; font-weight: 600; color: #262626; }

        /* 7. 貼文網格 (3格排列) */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .post {
            aspect-ratio: 1 / 1;
            background-color: #efefef;
            overflow: hidden;
            border-radius: 2px;
        }

        .post img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post.hidden { display: none; }
    </style>
</head>
<body>

    <div class="square-container">
        
        

        <div class="scrollable-content">
            <header class="header">
                <img src="img/788ad64d8a870606c2f8593da477dfb0.jpg" class="profile-pic">
                <div class="user-info">
                    <h2>Mitsuki_Ruli</h2>
                    <p>雑多垢</p>
                </div>
            </header>

            <div class="highlights">
                <div class="highlight-item active" data-target="all">
                    <div class="highlight-circle" style="display: flex; align-items: center; justify-content: center; background: #f0f0f0; font-size: 12px; font-weight: bold;">ALL</div>
                    <span class="highlight-name">♡</span>
                </div>
                <div class="highlight-item" data-target="char-1">
                    <img src="img/Ig/6101578a371553f6b6b34e118eac0e15.jpg" class="highlight-circle">
                    <span class="highlight-name">💙</span>
                </div>
                <div class="highlight-item" data-target="char-2">
                    <img src="img/Ig/a2504c66798a4c9ac8f6a341ff8ecd43.jpg" class="highlight-circle">
                    <span class="highlight-name">💜</span>
                </div>
              <div class="highlight-item" data-target="char-3">
                    <img src="img/Ig/911538821d026764a5715f40b6c84af3.jpg" class="highlight-circle">
                    <span class="highlight-name">ʜɪɴᴀᴛᴀ</span>
                </div>
             <div class="highlight-item" data-target="char-4">
                    <img src="img/Ig/dd2b1ce635964bf575912ef49dcd68db.jpg" class="highlight-circle">
                    <span class="highlight-name">ꜱᴏɢᴏ</span>
                </div>
             <div class="highlight-item" data-target="char-5">
                    <img src="img/Ig/4768c039a11016e52e9f7a841414766e.jpg" class="highlight-circle">
                    <span class="highlight-name">ʏᴀꜱᴀᴅᴀ</span>
                </div>
              <div class="highlight-item" data-target="char-6">
                    <img src="img/Ig/82b1339cbc1014a363e8dd92df340ee4.jpg" class="highlight-circle">
                    <span class="highlight-name">ʀᴇɴɢᴀ</span>
                </div>

                <div class="highlight-item" data-target="char-7">
                    <img src="img/Ig/4ecaefa448e2b7db1dd027f2bd68f978.jpg" class="highlight-circle">
                    <span class="highlight-name">ᴋᴏʀᴇꜱʜɪᴋɪ</span>
                </div>






                
            </div>

            <div class="post-grid">
                <div class="post" data-category="char-1"><img src="https://via.placeholder.com/400/FFB6C1?text=A_1"></div>
                <div class="post" data-category="char-2"><img src="https://via.placeholder.com/400/ADD8E6?text=B_1"></div>
                <div class="post" data-category="char-1"><img src="https://via.placeholder.com/400/FFB6C1?text=A_2"></div>
                <div class="post" data-category="char-2"><img src="https://via.placeholder.com/400/ADD8E6?text=B_2"></div>
                <div class="post" data-category="char-1"><img src="https://via.placeholder.com/400/FFB6C1?text=A_3"></div>
                <div class="post" data-category="char-2"><img src="https://via.placeholder.com/400/ADD8E6?text=B_3"></div>
            </div>
        </div>

    </div>

    <script>
        const filters = document.querySelectorAll('.highlight-item');
        const posts = document.querySelectorAll('.post');

        filters.forEach(filter => {
            filter.addEventListener('click', () => {
                // 1. 切換 active 樣式
                filters.forEach(f => f.classList.remove('active'));
                filter.classList.add('active');

                // 2. 獲取分類名稱
                const target = filter.getAttribute('data-target');

                // 3. 過濾圖片
                posts.forEach(post => {
                    const category = post.getAttribute('data-category');
                    if (target === 'all' || category === target) {
                        post.classList.remove('hidden');
                    } else {
                        post.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>
</html>
