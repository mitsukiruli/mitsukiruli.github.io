<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的推角週邊祭壇</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            color: var(--text-main);
        }

        /* 導覽列 */
        nav {
            background: white;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 935px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* 個人檔案 */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 44px;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #eee;
            margin-right: 80px;
            object-fit: cover;
        }

        .user-info h2 {
            font-weight: 300;
            font-size: 28px;
            margin: 0;
        }

        /* 精選動態 */
        .highlights {
            display: flex;
            gap: 25px;
            padding: 10px 0 40px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0;
        }

        .highlight-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            cursor: pointer;
        }

        .highlight-circle {
            width: 77px;
            height: 77px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            padding: 3px;
            background: white;
            margin-bottom: 5px;
            object-fit: cover;
        }

        .highlight-name {
            font-size: 12px;
            font-weight: 600;
        }

        /* 貼文網格 */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            margin-top: 50px;
        }

        .post {
            aspect-ratio: 1 / 1;
            background-color: #efefef;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .post img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s;
        }

        .post:hover img {
            filter: brightness(0.8);
        }

        /* 手機版調整 */
        @media (max-width: 735px) {
            .profile-pic { width: 80px; height: 80px; margin-right: 30px; }
            .post-grid { gap: 3px; }
            .container { padding: 0; }
            .header { padding: 20px; margin-bottom: 0; }
        }
    </style>
</head>
<body>

    <nav>Oshi_Collection</nav>

    <div class="container">
        <header class="header">
            <img src="https://via.placeholder.com/150" alt="大頭貼" class="profile-pic">
            <div class="user-info">
                <h2>你的 ID</h2>
                <p>這裡是放所有推角週邊的夢幻空間 ✨</p>
            </div>
        </header>

        <div class="highlights">
            <div class="highlight-item">
                <img src="https://via.placeholder.com/80" class="highlight-circle">
                <span class="highlight-name">角色 A</span>
            </div>
            <div class="highlight-item">
                <img src="https://via.placeholder.com/80" class="highlight-circle">
                <span class="highlight-name">角色 B</span>
            </div>
            <div class="highlight-item">
                <img src="https://via.placeholder.com/80" class="highlight-circle">
                <span class="highlight-name">角色 C</span>
            </div>
            </div>

        <div class="post-grid">
            <div class="post"><img src="https://via.placeholder.com/300" alt="週邊1"></div>
            <div class="post"><img src="https://via.placeholder.com/300" alt="週邊2"></div>
            <div class="post"><img src="https://via.placeholder.com/300" alt="週邊3"></div>
            <div class="post"><img src="https://via.placeholder.com/300" alt="週邊4"></div>
            <div class="post"><img src="https://via.placeholder.com/300" alt="週邊5"></div>
            <div class="post"><img src="https://via.placeholder.com/300" alt="週邊6"></div>
        </div>
    </div>

</body>
</html>
