<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Instagram Profile</title>
    <style>
        /* 1. 背景與置中設定 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* 淺藍色斜線背景 */
            background-color: #f0f8ff; 
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 15px,
                #d0e7ff 15px,
                #d0e7ff 17px
            );
        }

        /* 2. 中間的正方形容器 */
        .main-container {
            width: 90vw;
            max-width: 500px; /* 控制在電腦螢幕上的大小 */
            aspect-ratio: 1 / 1;
            
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 3. 內部捲動內容區域 */
        .ig-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* --- 以下是你原本的 IG 樣式融合 --- */
        
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #eee;
            margin-right: 20px;
            border: 1px solid #dbdbdb;
            object-fit: cover;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item b {
            display: block;
            font-size: 16px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin: 15px 0;
        }

        .btn {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 8px;
            background-color: #efefef;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .highlights {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .highlight-item {
            flex-shrink: 0;
            text-align: center;
            font-size: 12px;
        }

        .highlight-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid #dbdbdb;
            margin-bottom: 5px;
            background: #fafafa;
        }

        /* 隱藏捲動條但保留功能 */
        .ig-scroll-area::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="ig-scroll-area">
            
            <div class="profile-header">
                <div class="avatar"></div> <div class="stats">
                    <div class="stat-item"><b>12</b> 貼文</div>
                    <div class="stat-item"><b>158</b> 粉絲</div>
                    <div class="stat-item"><b>210</b> 追蹤中</div>
                </div>
            </div>

            <div class="bio">
                <strong>你的用戶名</strong><br>
                <span>這是一段自我介紹。✨<br>Bio description goes here.</span>
            </div>

            <div class="action-buttons">
                <button class="btn">編輯個人檔案</button>
                <button class="btn">分享個人檔案</button>
            </div>

            <div class="highlights">
                <div class="highlight-item"><div class="highlight-circle"></div>日常</div>
                <div class="highlight-item"><div class="highlight-circle"></div>旅行</div>
                <div class="highlight-item"><div class="highlight-circle"></div>美食</div>
                <div class="highlight-item"><div class="highlight-circle"></div>工作</div>
                <div class="highlight-item"><div class="highlight-circle"></div>貓咪</div>
            </div>

        </div>
    </div>

</body>
</html>
