<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="calendar.css">
</head>
<body>

    <div class="calendar-header">
        <h2 id="current-month-label">2025 July</h2>
        <h6>紀錄每一天的點點滴滴</h6>
    </div>

    <div class="month-selector">
        <button class="month-btn active" onclick="switchMonth(event, 'july-2025', '2025 July')">7月</button>
        <button class="month-btn" onclick="switchMonth(event, 'august-2025', '2025 August')">8月</button>
        <button class="month-btn" onclick="switchMonth(event, 'september-2025', '2025 September')">9月</button>
    </div>

    <div class="calendar-card">
        <div id="july-2025" class="month-content active">
            <table class="pixel-calendar">
                <tr class="weekday-row">
                    <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
                </tr>
                <tr>
                    <td></td><td></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td>
                </tr>
                <tr>
                    <td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td>
                </tr>
                <tr>
                    <td class="has-entry" onclick="toggleEntry(event)">
                        13<br><span>紀念日</span>
                        <div class="entry-content">
                            <b>我們的紀念日</b><br>
                            這裡可以寫下當天的回憶文字。<br>
                            <img src="img/photo1.jpg" alt="紀念照">
                        </div>
                    </td>
                    <td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td>
                </tr>
                <tr>
                    <td>20</td><td>21</td><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td>
                </tr>
                <tr>
                    <td>27</td><td>28</td><td>29</td><td>30</td><td>31</td><td></td><td></td>
                </tr>
            </table>
        </div>

        <div id="august-2025" class="month-content">
            <table class="pixel-calendar">
                <tr class="weekday-row">
                    <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
                </tr>
                <tr>
                    <td></td><td></td><td></td><td></td><td></td><td>1</td><td>2</td>
                </tr>
                <tr>
                    <td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td>
                </tr>
                <tr>
                    <td>10</td><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td><td>16</td>
                </tr>
                <tr>
                    <td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td>
                </tr>
                <tr>
                    <td>24</td><td>25</td><td>26</td><td>27</td><td>28</td><td>29</td><td>30</td>
                </tr>
                <tr>
                    <td>31</td><td></td><td></td><td></td><td></td><td></td><td></td>
                </tr>
            </table>
        </div>

        <div id="september-2025" class="month-content">
            <table class="pixel-calendar">
                <tr class="weekday-row">
                    <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
                </tr>
                <tr>
                    <td></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td>
                </tr>
                <tr>
                    <td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td>
                </tr>
                </table>
        </div>
    </div>

    <a href="Ruli.html" class="back-home">← Back to Home</a>

    <script src="js/calendar.js"></script>
</body>
</html>
