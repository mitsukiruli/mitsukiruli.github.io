<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link href="yume.css" rel="stylesheet">
    <link rel="stylesheet" href="book.css">

<title>Story</title>
  <meta content="" name="description"> <meta content="" name="keywords">
  <link href="img/testimonials/v/無標題252_20250902222530.png" rel="icon"> 
  <link href="img/testimonials/v/無標題252_20250902222530.png" rel="apple-touch-icon">

    </head>
<body>
<section id="world-system" class="section-bg">
    
    <div id="world-lobby" class="container">
        <div class="section-title">
            <h2 id="display-world-name" class="world-title-center"></h2>
            <p>點擊下方時空片段進入不同的故事軸線。</p>
        </div>
        <div class="world-timeline-container">
            <div class="world-card-entry" onclick="switchWorld('日常世界')">
                <div class="world-gif-layer">GIF Placeholder - 溫馨日常</div>
                <div class="world-card-info"><h3>日常世界</h3></div>
            </div>
            <div class="world-card-entry" onclick="switchWorld('世界線 A：黎明')">
                <div class="world-gif-layer">GIF Placeholder - 戰火殘雲</div>
                <div class="world-card-info"><h3>世界線 A：黎明</h3></div>
            </div>
            <div class="world-card-entry" onclick="switchWorld('世界線 B：機械')">
                <div class="world-gif-layer">GIF Placeholder - 霓虹閃爍</div>
                <div class="world-card-info"><h3>世界線 B：機械</h3></div>
            </div>
            </div>
    </div>

    <div id="world-detail-page" class="container" style="display: none;">
        <div class="nav-controls">
            <button class="btn-world-back" onclick="handleBack()">
                <i class="bi bi-arrow-left"></i> <span id="back-text">返回</span>
            </button>
        </div>
        
        <h2 id="display-world-name" class="world-title-font"></h2>

        <div id="overview-grid" class="world-grid">
            <div class="world-box" onclick="showChapters('主線劇情')">
                <h4><i class="bi bi-journal-bookmark"></i> 主線</h4>
            </div>
            <div class="world-box" onclick="showChapters('世界日常')">
                <h4><i class="bi bi-cup-hot"></i> 日常</h4>
            </div>
            <div class="world-box" onclick="showChapters('世界設定')">
                <h4><i class="bi bi-gear"></i> 設定</h4>
            </div>
        </div>

        <div id="chapter-view" class="chapter-view">
            <h3 id="category-title"></h3>
            <ul class="chapter-list" id="chapter-data">
                </ul>
        </div>
    </div>
</section>
    <script src="js/books.js"></script>

</body>
</html>
