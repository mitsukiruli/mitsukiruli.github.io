<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200..900&family=Shippori+Mincho+B1&display=swap" rel="stylesheet">
  <link href="vendor/aos/aos.css" rel="stylesheet">
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="yume.css" rel="stylesheet">
  <link rel="stylesheet" href="book.css">

    
<title>Story</title>
  <meta content="" name="description"> <meta content="" name="keywords">
  <link href="img/testimonials/v/無標題252_20250902222530.png" rel="icon"> 
  <link href="img/testimonials/v/無標題252_20250902222530.png" rel="apple-touch-icon">

    </head>
<body>
<section id="world-system" class="section-bg">
    <div id="world-lobby" class="container">
        <div class="section-title">
            <h2 class="world-title-center">Our Story</h2>
            <p>點擊下方時空片段進入不同的故事軸線。</p>
        </div>
        <div class="world-timeline-container">
            <div class="world-card-entry" onclick="switchWorld('story.html')">
                <div class="world-gif-layer"></div>
                <div class="world-card-info"><h3>日常/問卷</h3></div>
            </div>
            <div class="world-card-entry" onclick="switchWorld('獵人vanilLa✕吸血鬼瑠璃')">
                <div class="world-gif-layer"></div>
                <div class="world-card-info"><h3>獵人vanilLa✕吸血鬼瑠璃</h3></div>
            </div>
            
            <div class="world-card-entry" onclick="switchWorld('獅院三年級生vanilLa✕鷹院一年級生瑠璃')">
                <div class="world-gif-layer"></div>
                <div class="world-card-info"><h3>hp paro 獅院三年級生vanilLa✕鷹院一年級生瑠璃</h3></div>
            </div>

            <div class="world-card-entry" onclick="switchWorld('樂團')">
                <div class="world-gif-layer"></div>
                <div class="world-card-info"><h3>樂團pa 主唱兼副吉他手vanilLa✕吉他手瑠璃</h3></div>
            </div>
        
            
            <div class="world-card-entry" onclick="switchWorld('男公關')">
                <div class="world-gif-layer"></div>
                <div class="world-card-info"><h3>mt gta公關 vanilLa✕暈船姬 瑠璃</h3></div>
            </div>
        

            
        </div>
    </div>

    <div id="world-detail-page" class="container" style="display: none;">
        <h2 id="display-world-name" class="world-title-center"></h2>
        <div class="world-banner-container">
        <img id="world-banner-img" src="" alt="World Banner">
        </div>

        <div id="overview-grid" class="world-grid">
            <div class="world-box" onclick="showChapters('主線劇情')"><h4>主線</h4></div>
            <div class="world-box" onclick="showChapters('世界日常')"><h4>日常</h4></div>
            <div class="world-box" onclick="showChapters('世界設定')"><h4>設定</h4></div>
        </div>

        <div id="chapter-view" class="chapter-view" style="display: none;">
            <h3 id="category-title"></h3>
            <ul class="chapter-list" id="chapter-data"></ul>
        </div>

        <div id="article-reader" class="article-reader" style="display: none;">
            <div id="article-content"></div>
        </div>

        <div class="world-footer-nav">
            <button class="cute-world-back-button" onclick="handleBack()">
                <i class="bi bi-arrow-left"></i>
            </button>
        </div>
    </div>
    <div id="music-player-container" style="display: none; position: fixed; top: 30px; right: 30px; z-index: 1000;">
    <audio id="bgm-audio"></audio>
    <div id="music-toggle-btn" class="music-icon-btn">
        <i id="music-icon" class="bi bi-music-note-beamed"></i>
    </div>
</div>



</section>
    
<div class="footer-nav" id="main-footer-nav">
    <a href="picture.html">
        <i class="bi bi-caret-left-fill"></i>
        <span>上一頁</span>
    </a>

    <a href="Ruli.html" class="cute-back-up-button">
        <span class="paw-print">🐾</span>
    </a>

    <a href="calendar.html">
        <span>下一頁</span>
        <i class="bi bi-caret-right-fill"></i>
    </a>
</div>
    
    
<script src="js/books.js"></script>



</body>
</html>
